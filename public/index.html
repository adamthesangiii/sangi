<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2230">
<title>Zemkop</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="apple-mobile-web-app-title" content="Zemkop">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f7;--panel:#fff;--ink:#1c2230;--muted:#6b7385;--line:#e2e5eb;--soft:#eef0f4;
--rr:#b8432c;--rr-bg:#f8e9e5;--zk:#2f6ea5;--zk-bg:#e6eff8;--co:var(--rr);--co-bg:var(--rr-bg);
--ok:#2e7d4f;--ok-bg:#e5f3ea;--warn:#a86a00;--warn-bg:#fdf2dc;--bad:#b3261e;--bad-bg:#fbe7e6;--r:12px;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
body.zk{--co:var(--zk);--co-bg:var(--zk-bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(10px + var(--st)) 14px 10px}
.hrow{display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto}
.title{font-weight:800;font-size:18px;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.hlogo{height:26px;width:auto;flex:none}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.1);color:var(--ink)}
.seg button.on.rr{color:var(--rr)}.seg button.on.zk{color:var(--zk)}
main{padding:14px 14px calc(96px + var(--sb));max-width:900px;margin:0 auto}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--sb))}
nav.bottom button{flex:1;border:0;background:none;padding:6px 2px;color:var(--muted);font-size:11.5px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--co)}
nav.bottom .plus{flex:0 0 auto;width:62px}
nav.bottom .plus span.c{width:50px;height:50px;border-radius:50%;background:var(--co);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.02em}.kpi .s{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--co);border-color:var(--co);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
.muted{color:var(--muted)}.small{font-size:12.5px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.planned{background:var(--warn-bg);color:var(--warn)}.pill.active{background:var(--co-bg);color:var(--co)}.pill.done{background:var(--ok-bg);color:var(--ok)}
.job{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;cursor:pointer}
.job .t{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--co);border-radius:4px}
.bar.over i{background:var(--warn)}
.row{display:flex;align-items:center;gap:10px}
.list .it{padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);width:100%;font-size:16px}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:12px}
label.f>*{margin-top:5px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:999px;font-weight:500;cursor:pointer}
.chip.on{background:var(--co);border-color:var(--co);color:#fff}
/* block rows */
.ser{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 2px 6px}
.blk{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.blk.sel{border-color:var(--co);background:var(--co-bg)}
.blk img,.blk .noimg{width:64px;height:44px;object-fit:contain;flex:none;background:#fff;border-radius:6px}
.blk .noimg{background:var(--soft)}
.blk .info{flex:1;min-width:0}
.blk .code{font-weight:700}
.blk .d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{display:flex;align-items:center;gap:4px;flex:none}
.qty button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:20px;font-weight:600;cursor:pointer;line-height:1}
.qty input{width:52px;text-align:center;padding:7px 4px;font-weight:700}
/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
.sheet.on{display:flex}
.shead{background:var(--panel);border-bottom:1px solid var(--line);padding:calc(10px + var(--st)) 14px 10px;display:flex;align-items:center;gap:10px}
.shead h2{margin:0;font-size:17px;flex:1}
.sbody{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.sbody>div{max-width:900px;margin:0 auto}
.sfoot{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--sb));display:flex;gap:10px;align-items:center}
.sfoot .sum{flex:1;font-size:13px}
.sfoot .sum b{font-size:16px}
.modal{position:fixed;inset:0;z-index:90;background:rgba(20,24,33,.4);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:var(--panel);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + var(--sb));max-height:90vh;overflow:auto}
@media(min-width:640px){.modal{align-items:center}.modal .box{border-radius:16px}}
.modal h2{margin:0 0 12px;font-size:17px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.banner{background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:10px;margin-bottom:12px;display:none}
.banner.on{display:block}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sb));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.ld{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.ld .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.ld .items{font-size:13px;margin-top:4px;color:var(--ink)}
.tex{margin-bottom:10px}
.cat-img{width:100%;max-width:260px;height:140px;object-fit:contain;background:#fff;border-radius:8px;display:block;margin:0 auto 10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.ro .w{display:none!important}
</style>
</head>

<header><div class="hrow">
  <div class="title" id="hTitle"><img src="/logo-mark.png" alt="" class="hlogo">Zemkop</div>
  <div class="seg" id="coSeg"><button data-co="redirock" class="rr">Redi-Rock</button><button data-co="zemkop" class="zk">ZEMKOP blok</button></div>
</div></header>
<main><div class="banner" id="banner"></div><div id="view"><div class="empty">Načítavam…</div></div></main>

  <button data-v="zakazky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Zákazky</button>
  <button class="plus w" id="navPlus"><span class="c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></span>Nakládka</button>
  <button data-v="nakladky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>Nakládky</button>
  <button data-v="katalog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l9-5 9 5-9 5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>Bloky</button>
</nav>

(() => {
const JOB_ST = {planned:'Pripravuje sa', active:'Prebieha', done:'Ukončená'};
const TEX = {LED:'Ledgestone', LIM:'Limestone'};
const S = {co:'redirock', view:'prehlad', blocks:[], jobs:[], loads:[], workers:[], got:{b:0,j:0,l:0,w:0}, canWrite:true, me:null, jf:'open', lq:'', tex:'LED', cq:''};
try{ const s=JSON.parse(localStorage.getItem('nk-ui')||'{}'); if(s.co) S.co=s.co; if(s.view) S.view=s.view; if(s.tex) S.tex=s.tex; }catch(e){}
const persist=()=>{ try{ localStorage.setItem('nk-ui',JSON.stringify({co:S.co,view:S.view,tex:S.tex})); }catch(e){} };
let db=null;
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const localDT=(t)=>{ const d=new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayKey=t=>{ const d=new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDT=t=>{ const d=new Date(t); return `${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtD=t=>{ const d=new Date(t); return `${d.getDate()}. ${d.getMonth()+1}.`; };
const nf=new Intl.NumberFormat('sk-SK',{maximumFractionDigits:1});
const tons=kg=>nf.format((kg||0)/1000)+' t';
const COL={redirock:'Redi-Rock', zemkop:'ZEMKOP blok'};

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }
function banner(m){ const b=$('#banner'); b.textContent=m||''; b.classList.toggle('on',!!m); }
function setRO(){ S.canWrite=false; document.body.classList.add('ro'); }
async function write(fn){
  if(!db){ toast('Databáza nie je dostupná'); return false; }
  try{ await fn(); return true; }catch(e){
    if(e&&(e.code==='unavailable'||e.code==='server')){ await new Promise(r=>setTimeout(r,500+Math.random()*700)); try{ await fn(); return true; }catch(e2){ e=e2; } }
    if(e&&e.code==='unauth') return false;
    toast(e&&e.message?e.message:'Uloženie zlyhalo, skúste znova');
    return false;
  }
}

/* ---------- helpers on data ---------- */
const blkByCode=code=>S.blocks.find(b=>b.code===code);
const coBlocks=()=>S.blocks.filter(b=>b.company===S.co).sort((a,b)=>(a.order||0)-(b.order||0));
const coJobs=()=>S.jobs.filter(j=>j.company===S.co);
const coLoads=()=>S.loads.filter(l=>l.company===S.co);
const jobById=id=>S.jobs.find(j=>j.id===id);
const weightOf=items=>(items||[]).reduce((s,i)=>s+(+i.qty||0)*((blkByCode(i.code)||{}).weight||0),0);
const piecesOf=items=>(items||[]).reduce((s,i)=>s+(+i.qty||0),0);
function sumItems(loads){ const m={}; loads.forEach(l=>(l.items||[]).forEach(i=>{ m[i.code]=(m[i.code]||0)+(+i.qty||0); })); return m; }
function blkImg(b,cls=''){ const src=b&&b.img&&window.IMG&&IMG[b.img]; return src?`<img class="${cls}" src="${src}" alt="">`:`<div class="noimg ${cls}"></div>`; }
function blkLabel(b){ return [b.desc,b.dims,b.weight?b.weight+' kg':''].filter(Boolean).join(' · '); }
const itemsText=items=>(items||[]).map(i=>`${esc(i.code)} × ${i.qty}`).join(', ');

/* ---------- render ---------- */
function render(){
  document.body.classList.toggle('zk',S.co==='zemkop');
  document.querySelectorAll('#coSeg button').forEach(b=>b.classList.toggle('on',b.dataset.co===S.co));
  document.querySelectorAll('#nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  const v=$('#view');
  if(!db) return;
  if(!(S.got.b&&S.got.j&&S.got.l&&S.got.w)){ v.innerHTML='<div class="empty">Načítavam údaje…</div>'; return; }
  v.innerHTML = S.view==='zakazky'?vJobs(): S.view==='nakladky'?vLoads(): S.view==='katalog'?vCatalog(): vHome();
  bind(v);
}
function jobProgress(j){
  const loads=S.loads.filter(l=>l.jobId===j.id); const done=sumItems(loads);
  const plan=j.plan||{}; const planned=Object.values(plan).reduce((s,x)=>s+(+x||0),0);
  const doneP=Object.values(done).reduce((s,x)=>s+x,0);
  const doneKg=Object.entries(done).reduce((s,[c,q])=>s+q*((blkByCode(c)||{}).weight||0),0);
  return {loads,done,planned,doneP,doneKg,pct:planned?Math.round(doneP/planned*100):null};
}
function jobCard(j){
  const p=jobProgress(j);
  return `<button class="job" data-job="${esc(j.id)}"><div class="t"><span>${esc(j.name)}</span><span class="pill ${j.status}">${JOB_ST[j.status]||''}</span></div>
    <div class="small muted">${esc([j.customer,j.place].filter(Boolean).join(' · '))}</div>
    <div class="small" style="margin-top:6px">Naložené <b>${p.doneP} ks</b> · ${tons(p.doneKg)}${p.planned?` z ${p.planned} ks plánu (${p.pct} %)`:''}${p.loads.length?` · posledná ${fmtD(Math.max(...p.loads.map(l=>l.at)))}`:''}</div>
    ${p.planned?`<div class="bar ${p.pct>100?'over':''}"><i style="width:${Math.min(100,p.pct)}%"></i></div>`:''}</button>`;
}
function loadCard(l, showJob=true){
  const j=jobById(l.jobId);
  return `<div class="ld" data-load="${esc(l.id)}"><div class="h"><span>${showJob?esc(j?j.name:'Bez zákazky'):fmtDT(l.at)}</span><span class="small muted" style="font-weight:500">${showJob?fmtDT(l.at):''}</span></div>
    <div class="small muted">Nakladal: ${esc((l.loaders||[]).join(', ')||'—')}${l.plate?' · '+esc(l.plate):''} · ${piecesOf(l.items)} ks · ${tons(weightOf(l.items))}</div>
    <div class="items">${itemsText(l.items)}</div>${l.note?`<div class="small muted" style="margin-top:4px">${esc(l.note)}</div>`:''}</div>`;
}
function vHome(){
  const loads=coLoads(); const now=new Date(); const tk=dayKey(now);
  const wk=new Date(now); wk.setHours(0,0,0,0); wk.setDate(wk.getDate()-((wk.getDay()+6)%7));
  const ms=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const lt=loads.filter(l=>dayKey(l.at)===tk), lw=loads.filter(l=>l.at>=wk.getTime()), lm=loads.filter(l=>l.at>=ms);
  const allP=x=>x.reduce((s,l)=>s+piecesOf(l.items),0), allW=x=>x.reduce((s,l)=>s+weightOf(l.items),0);
  const act=coJobs().filter(j=>j.status!=='done');
  const top=Object.entries(sumItems(lm)).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxT=top.length?top[0][1]:1;
  let h=`<div class="kpis">
    <div class="kpi"><div class="l">Dnes naložené</div><div class="v">${allP(lt)} ks</div><div class="s">${tons(allW(lt))} · ${lt.length} nakládok</div></div>
    <div class="kpi"><div class="l">Tento týždeň</div><div class="v">${allP(lw)} ks</div><div class="s">${tons(allW(lw))}</div></div>
    <div class="kpi"><div class="l">Tento mesiac</div><div class="v">${allP(lm)} ks</div><div class="s">${tons(allW(lm))}</div></div>
    <div class="kpi"><div class="l">Rozbehnuté zákazky</div><div class="v">${act.length}</div><div class="s">${coJobs().filter(j=>j.status==='done').length} ukončených</div></div>
  </div>`;
  if(S.canWrite) h+=`<button class="btn pri block" data-a="newLoad" style="margin-bottom:12px">+ Zapísať nakládku</button>`;
  h+=`<div class="card"><h3>Rozbehnuté zákazky</h3>${act.length?act.slice(0,6).map(jobCard).join(''):`<div class="muted small">Žiadne. ${S.canWrite?'<a href="#" data-a="newJob">Založiť zákazku</a>':''}</div>`}</div>`;
  h+=`<div class="card"><h3>Najviac odoberané bloky tento mesiac</h3>${top.length?`<table>${top.map(([c,q])=>{ const b=blkByCode(c)||{}; return `<tr><td style="width:70px">${blkImg(b)}</td><td><b>${esc(c)}</b><div class="small muted">${esc(b.dims||'')}</div><div class="bar"><i style="width:${q/maxT*100}%"></i></div></td><td class="n"><b>${q}</b> ks<div class="small muted">${tons(q*(b.weight||0))}</div></td></tr>`; }).join('')}</table>`:'<div class="muted small">Tento mesiac zatiaľ nič.</div>'}</div>`;
  h+=`<div class="card"><h3>Posledné nakládky</h3>${loads.length?loads.slice(0,5).map(l=>loadCard(l)).join(''):'<div class="muted small">Zatiaľ žiadne nakládky.</div>'}</div>`;
  return h.replace(/<img /g,'<img style="width:60px;height:40px;object-fit:contain" ');
}
function vJobs(){
  const f=S.jf; let js=coJobs();
  if(f==='open') js=js.filter(j=>j.status!=='done'); else if(f!=='all') js=js.filter(j=>j.status===f);
  const q=S.lq.trim().toLowerCase(); if(q) js=js.filter(j=>[j.name,j.customer,j.place,j.note].join(' ').toLowerCase().includes(q));
  js.sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
  return `<div class="toolbar"><input type="search" id="jq" placeholder="Hľadať zákazku…" value="${esc(S.lq)}"><button class="btn pri w" data-a="newJob" style="white-space:nowrap">+ Zákazka</button></div>
    <div class="chips" style="margin-bottom:12px">${[['open','Otvorené'],['planned','Pripravuje sa'],['active','Prebieha'],['done','Ukončené'],['all','Všetky']].map(([k,n])=>`<button class="chip ${f===k?'on':''}" data-jf="${k}">${n}</button>`).join('')}</div>
    ${js.length?js.map(jobCard).join(''):'<div class="empty">Žiadne zákazky.</div>'}`;
}
function vLoads(){
  let ls=coLoads(); const q=S.lq.trim().toLowerCase();
  if(q) ls=ls.filter(l=>{ const j=jobById(l.jobId)||{}; return [j.name,j.customer,(l.loaders||[]).join(' '),l.plate,l.note,(l.items||[]).map(i=>i.code).join(' ')].join(' ').toLowerCase().includes(q); });
  const groups={}; ls.forEach(l=>{ (groups[dayKey(l.at)]=groups[dayKey(l.at)]||[]).push(l); });
  const days=Object.keys(groups).sort().reverse();
  return `<div class="toolbar"><input type="search" id="lq" placeholder="Hľadať zákazku, blok, pracovníka…" value="${esc(S.lq)}"><button class="btn sm" data-a="copyLoads">Kopírovať</button></div>
    ${days.length?days.map(d=>{ const g=groups[d]; const [y,m,dd]=d.split('-');
      return `<div class="ser" style="display:flex;justify-content:space-between"><span>${+dd}. ${+m}. ${y}</span><span>${g.reduce((s,l)=>s+piecesOf(l.items),0)} ks · ${tons(g.reduce((s,l)=>s+weightOf(l.items),0))}</span></div>${g.map(l=>loadCard(l)).join('')}`; }).join('')
    :`<div class="empty">Zatiaľ žiadne nakládky.${S.canWrite?'<br><br><button class="btn pri" data-a="newLoad">+ Zapísať nakládku</button>':''}</div>`}`;
}
function texSeg(){ return S.co==='redirock'?`<div class="seg tex" id="texSeg">${Object.entries(TEX).map(([k,n])=>`<button data-tex="${k}" class="${S.tex===k?'on rr':''}">${n}</button>`).join('')}</div>`:''; }
function vCatalog(){
  let bs=coBlocks(); if(S.co==='redirock') bs=bs.filter(b=>b.texture===S.tex);
  const q=S.cq.trim().toLowerCase(); if(q) bs=bs.filter(b=>[b.code,b.desc,b.dims,b.series].join(' ').toLowerCase().includes(q));
  let h=texSeg()+`<div class="toolbar"><input type="search" id="cq" placeholder="Hľadať kód alebo rozmer (napr. A3, 120x60)…" value="${esc(S.cq)}"><button class="btn sm w" data-a="newBlock">+ Blok</button></div>`;
  if(!S.blocks.length) return h+'<div class="empty">Katalóg blokov je prázdny.</div>';
  let ser=null;
  bs.forEach(b=>{ if(b.series!==ser){ ser=b.series; h+=`<div class="ser">${esc(ser||'Ostatné')}</div>`; }
    h+=`<div class="blk ${b.active===false?'':''}" data-blk="${esc(b.id)}" style="cursor:pointer;${b.active===false?'opacity:.5':''}">${blkImg(b)}<div class="info"><div class="code">${esc(b.code)}</div><div class="d">${esc(blkLabel(b))}</div></div></div>`; });
  return h;
}

function bind(v){
  v.querySelectorAll('[data-job]').forEach(e=>e.onclick=()=>openJob(e.dataset.job));
  v.querySelectorAll('[data-load]').forEach(e=>e.onclick=()=>loadSheet(S.loads.find(l=>l.id===e.dataset.load)));
  v.querySelectorAll('[data-blk]').forEach(e=>e.onclick=()=>blockModal(S.blocks.find(b=>b.id===e.dataset.blk)));
  v.querySelectorAll('[data-a=newLoad]').forEach(e=>e.onclick=()=>loadSheet());
  v.querySelectorAll('[data-a=newJob]').forEach(e=>e.onclick=ev=>{ev.preventDefault();jobModal();});
  v.querySelectorAll('[data-a=newBlock]').forEach(e=>e.onclick=()=>blockModal());
  v.querySelectorAll('[data-a=copyLoads]').forEach(e=>e.onclick=copyLoads);
  v.querySelectorAll('[data-jf]').forEach(e=>e.onclick=()=>{S.jf=e.dataset.jf;render();});
  v.querySelectorAll('[data-tex]').forEach(e=>e.onclick=()=>{S.tex=e.dataset.tex;persist();render();});
  ['jq','lq'].forEach(id=>{ const i=v.querySelector('#'+id); if(i) i.oninput=()=>{ S.lq=i.value; const p=i.selectionStart; render(); const n=$('#'+id); n.focus(); n.setSelectionRange(p,p); }; });
  const c=v.querySelector('#cq'); if(c) c.oninput=()=>{ S.cq=c.value; const p=c.selectionStart; render(); const n=$('#cq'); n.focus(); n.setSelectionRange(p,p); };
}

/* ---------- sheet / modal ---------- */
function openSheet(title,body,foot){
  const s=$('#sheet'); s.innerHTML=`<div class="shead"><button class="btn sm" id="shClose">✕</button><h2>${title}</h2></div><div class="sbody"><div>${body}</div></div>${foot?`<div class="sfoot">${foot}</div>`:''}`;
  s.classList.add('on'); document.body.style.overflow='hidden'; s.querySelector('#shClose').onclick=closeSheet; return s;
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#sheet').innerHTML=''; document.body.style.overflow=''; S.openJob=null; }
function openModal(html){ $('#mbox').innerHTML=html; $('#modal').classList.add('on'); return $('#mbox'); }
function closeModal(){ $('#modal').classList.remove('on'); }
$('#modal').onclick=e=>{ if(e.target.id==='modal' && PIN) closeModal(); };
function confirmBox(msg,yes,fn){ const m=openModal(`<h2>Potvrdenie</h2><p>${esc(msg)}</p><div class="mfoot"><button class="btn" id="cN">Zrušiť</button><button class="btn pri" id="cY">${esc(yes)}</button></div>`); m.querySelector('#cN').onclick=closeModal; m.querySelector('#cY').onclick=async()=>{closeModal();await fn();}; }

/* ---------- block picker ---------- */
function picker(root, qty, onChange, opts={}){
  let tex = S.tex, q='';
  const draw=()=>{
    let bs=coBlocks().filter(b=>b.active!==false || qty[b.code]);
    if(S.co==='redirock') bs=bs.filter(b=>b.texture===tex);
    if(q) bs=bs.filter(b=>[b.code,b.desc,b.dims,b.series].join(' ').toLowerCase().includes(q));
    const sel=coBlocks().filter(b=>qty[b.code]>0 && (S.co!=='redirock'||b.texture!==tex));
    let h='';
    if(S.co==='redirock') h+=`<div class="seg tex">${Object.entries(TEX).map(([k,n])=>`<button type="button" data-ptex="${k}" class="${tex===k?'on rr':''}">${n}</button>`).join('')}</div>`;
    if(sel.length) h+=`<div class="small muted" style="margin-bottom:8px">Vybrané aj z druhej textúry: ${sel.map(b=>esc(b.code)+' × '+qty[b.code]).join(', ')}</div>`;
    h+=`<input type="search" class="pq" placeholder="Hľadať blok (kód, rozmer)…" value="${esc(q)}" style="margin-bottom:6px">`;
    let ser=null;
    bs.forEach(b=>{ if(b.series!==ser){ ser=b.series; h+=`<div class="ser">${esc(ser||'Ostatné')}</div>`; }
      const n=qty[b.code]||0;
      h+=`<div class="blk ${n?'sel':''}">${blkImg(b)}<div class="info"><div class="code">${esc(b.code)}</div><div class="d">${esc(blkLabel(b))}</div></div>
        <div class="qty"><button type="button" data-m="${esc(b.code)}">−</button><input inputmode="numeric" data-q="${esc(b.code)}" value="${n||''}" placeholder="0"><button type="button" data-p="${esc(b.code)}">+</button></div></div>`; });
    if(!bs.length) h+='<div class="empty">Žiadne bloky.</div>';
    root.innerHTML=h;
    root.querySelectorAll('[data-ptex]').forEach(e=>e.onclick=()=>{tex=e.dataset.ptex;S.tex=tex;persist();draw();});
    const pq=root.querySelector('.pq'); pq.oninput=()=>{ q=pq.value.trim().toLowerCase(); const p=pq.selectionStart; draw(); const n=root.querySelector('.pq'); n.focus(); n.setSelectionRange(p,p); };
    const setQ=(c,n,el)=>{ n=Math.max(0,Math.round(+n||0)); if(n) qty[c]=n; else delete qty[c]; onChange();
      const row=root.querySelector(`[data-q="${CSS.escape(c)}"]`); if(row&&row!==el){ row.value=n||''; } if(row) row.closest('.blk').classList.toggle('sel',!!n); };
    root.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>setQ(e.dataset.p,(qty[e.dataset.p]||0)+1));
    root.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>setQ(e.dataset.m,(qty[e.dataset.m]||0)-1));
    root.querySelectorAll('[data-q]').forEach(e=>{ e.oninput=()=>setQ(e.dataset.q,e.value,e); e.onfocus=()=>e.select(); });
  };
  draw();
}

/* ---------- loading sheet ---------- */
function loadSheet(l, presetJob){
  const isNew=!l;
  if(!isNew && !S.canWrite){ return; }
  if(isNew && !S.canWrite) return;
  if(!coBlocks().length){ toast('Katalóg blokov je prázdny'); return; }
  const qty={}; (l?l.items:[]).forEach(i=>qty[i.code]=i.qty);
  let loaders=new Set(l?l.loaders||[]:(()=>{ try{ return JSON.parse(localStorage.getItem('nk-loaders-'+S.co)||'[]'); }catch(e){ return []; } })());
  const jobs=coJobs().filter(j=>j.status!=='done' || (l&&j.id===l.jobId) || j.id===presetJob).sort((a,b)=>(a.name||'').localeCompare(b.name||'','sk'));
  let jobSel = l?l.jobId:(presetJob || (()=>{ try{ return localStorage.getItem('nk-lastjob-'+S.co)||''; }catch(e){ return ''; } })());
  if(!jobs.some(j=>j.id===jobSel)) jobSel = jobs.filter(j=>j.status!=='done').length===1 ? jobs.find(j=>j.status!=='done').id : '';
  const body=`
    <label class="f">Zákazka<div class="row"><select id="lJob"><option value="">— vyberte zákazku —</option>${jobs.map(j=>`<option value="${esc(j.id)}" ${j.id===jobSel?'selected':''}>${esc(j.name)}${j.customer?' – '+esc(j.customer):''}</option>`).join('')}</select><button type="button" class="btn sm" id="lNewJob" style="white-space:nowrap">+ Nová</button></div></label>
    <label class="f">Kto nakladal<div class="chips" id="lWorkers"></div></label>
    <div class="row" style="gap:10px"><label class="f" style="flex:1">Dátum a čas<input type="datetime-local" id="lAt" value="${localDT(l?l.at:Date.now())}"></label>
    <label class="f" style="flex:1">ŠPZ / vodič<input id="lPlate" value="${esc(l?l.plate||'':'')}" placeholder="nepovinné"></label></div>
    <label class="f">Poznámka<input id="lNote" value="${esc(l?l.note||'':'')}" placeholder="napr. dodací list č., miesto vykládky"></label>
    <div class="ser" style="margin-top:6px">Naložené bloky</div><div id="lPick"></div>
    ${!isNew?'<button class="btn danger block" id="lDel" style="margin-top:18px">Zmazať nakládku</button>':''}`;
  const s=openSheet(isNew?'Nová nakládka – '+COL[S.co]:'Upraviť nakládku',body,`<div class="sum" id="lSum"></div><button class="btn pri" id="lSave">Uložiť</button>`);
  const upd=()=>{ const items=Object.entries(qty).map(([code,q])=>({code,qty:q})); s.querySelector('#lSum').innerHTML=`<b>${piecesOf(items)} ks</b> · ${tons(weightOf(items))}<div class="muted">${items.length} druhov blokov</div>`; };
  const drawW=()=>{ const ws=S.workers.filter(w=>w.active!==false).map(w=>w.name); [...loaders].forEach(n=>{ if(!ws.includes(n)) ws.push(n); });
    s.querySelector('#lWorkers').innerHTML=ws.map(n=>`<button type="button" class="chip ${loaders.has(n)?'on':''}" data-w="${esc(n)}">${esc(n)}</button>`).join('')+`<button type="button" class="chip" id="addW">+ Pridať meno</button>`;
    s.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ const n=b.dataset.w; loaders.has(n)?loaders.delete(n):loaders.add(n); drawW(); });
    s.querySelector('#addW').onclick=()=>{ const m=openModal(`<h2>Nový pracovník</h2><label class="f">Meno<input id="wN" autofocus></label><div class="mfoot"><button class="btn" id="wC">Zrušiť</button><button class="btn pri" id="wS">Pridať</button></div>`);
      m.querySelector('#wC').onclick=closeModal; m.querySelector('#wS').onclick=async()=>{ const n=m.querySelector('#wN').value.trim(); if(!n) return; closeModal();
        if(!S.workers.some(w=>w.name===n)){ const ref=db.collection('workers').doc(); await write(()=>ref.set({name:n,active:true,createdAt:Date.now()})); }
        loaders.add(n); drawW(); }; setTimeout(()=>m.querySelector('#wN').focus(),50); };
  };
  drawW(); picker(s.querySelector('#lPick'),qty,upd); upd();
  s.querySelector('#lNewJob').onclick=()=>jobModal(null,id=>{ const sel=s.querySelector('#lJob'); const j=jobById(id)||{id,name:'Nová zákazka'}; const o=document.createElement('option'); o.value=id; o.textContent=j.name; sel.appendChild(o); sel.value=id; });
  const del=s.querySelector('#lDel'); if(del) del.onclick=()=>confirmBox('Naozaj zmazať túto nakládku?','Zmazať',async()=>{ if(await write(()=>db.collection('loads').doc(l.id).delete())){ closeSheet(); toast('Nakládka zmazaná'); } });
  s.querySelector('#lSave').onclick=async()=>{
    const jobId=s.querySelector('#lJob').value;
    const items=Object.entries(qty).filter(([,q])=>q>0).map(([code,q])=>({code,qty:q}));
    if(!jobId){ toast('Vyberte zákazku'); s.querySelector('#lJob').focus(); return; }
    if(!items.length){ toast('Pridajte aspoň jeden blok'); return; }
    if(!loaders.size){ toast('Označte, kto nakladal'); return; }
    const atV=s.querySelector('#lAt').value; const at=atV?new Date(atV).getTime():Date.now();
    const data={company:S.co,jobId,items,loaders:[...loaders],at,plate:s.querySelector('#lPlate').value.trim(),note:s.querySelector('#lNote').value.trim(),
      pieces:piecesOf(items),weightKg:weightOf(items),updatedAt:Date.now()};
    const btn=s.querySelector('#lSave'); btn.disabled=true;
    let ok;
    if(isNew){ data.createdAt=Date.now(); data.createdBy=S.me||null; const ref=db.collection('loads').doc(); ok=await write(()=>ref.set(data)); }
    else ok=await write(()=>db.collection('loads').doc(l.id).set({...l,...data,id:undefined}));
    btn.disabled=false;
    if(ok){
      try{ localStorage.setItem('nk-loaders-'+S.co,JSON.stringify([...loaders])); localStorage.setItem('nk-lastjob-'+S.co,jobId); }catch(e){}
      const j=jobById(jobId); if(j&&j.status==='planned') await write(()=>db.collection('jobs').doc(jobId).update({status:'active',updatedAt:Date.now()}));
      else if(j) await write(()=>db.collection('jobs').doc(jobId).update({updatedAt:Date.now()}));
      closeSheet(); toast(isNew?'Nakládka uložená':'Uložené');
    }
  };
}

/* ---------- job detail ---------- */
function openJob(id){
  const j=jobById(id); if(!j){ closeSheet(); return; }
  S.openJob=id;
  const p=jobProgress(j); const plan=j.plan||{};
  const codes=[...new Set([...Object.keys(plan),...Object.keys(p.done)])].sort((a,b)=>((blkByCode(a)||{}).order||0)-((blkByCode(b)||{}).order||0));
  const loads=p.loads.sort((a,b)=>b.at-a.at);
  const body=`
    <div class="card"><div class="row" style="justify-content:space-between"><span class="pill ${j.status}">${JOB_ST[j.status]}</span>${S.canWrite?'<button class="btn sm" id="jEdit">Upraviť</button>':''}</div>
      <div class="kv" style="margin-top:10px"><div>Zákazník</div><div>${esc(j.customer||'—')}</div><div>Miesto</div><div>${esc(j.place||'—')}</div>
      ${j.contact?`<div>Kontakt</div><div>${esc(j.contact)}</div>`:''}<div>Poznámka</div><div style="white-space:pre-wrap">${esc(j.note||'—')}</div></div>
      ${S.canWrite?`<div class="chips" style="margin-top:12px">${Object.entries(JOB_ST).map(([k,n])=>`<button class="chip ${j.status===k?'on':''}" data-js="${k}">${n}</button>`).join('')}</div>`:''}</div>
    <div class="kpis"><div class="kpi"><div class="l">Naložené</div><div class="v">${p.doneP} ks</div><div class="s">${tons(p.doneKg)}</div></div>
      <div class="kpi"><div class="l">Plán</div><div class="v">${p.planned||'–'}${p.planned?' ks':''}</div><div class="s">${p.planned?(p.pct+' % hotovo'):'plán nie je zadaný'}</div></div></div>
    ${S.canWrite?'<button class="btn pri block" id="jLoad" style="margin-bottom:12px">+ Zapísať nakládku na túto zákazku</button>':''}
    <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Materiál podľa blokov</h3>${S.canWrite?'<button class="btn sm" id="jPlan">Plán blokov</button>':''}</div>
      ${codes.length?`<table><tr><th></th><th>Blok</th><th class="n">Naložené</th><th class="n">Plán</th></tr>${codes.map(c=>{ const b=blkByCode(c)||{}; const d=p.done[c]||0, pl=plan[c]||0;
        return `<tr><td style="width:62px">${blkImg(b).replace('<img','<img style="width:56px;height:38px;object-fit:contain"')}</td><td><b>${esc(c)}</b><div class="small muted">${esc(b.dims||'')}</div>${pl?`<div class="bar ${d>pl?'over':''}"><i style="width:${Math.min(100,d/pl*100)}%"></i></div>`:''}</td>
        <td class="n"><b>${d}</b><div class="small muted">${tons(d*(b.weight||0))}</div></td><td class="n">${pl?pl+(d<pl?`<div class="small muted">zostáva ${pl-d}</div>`:d>pl?`<div class="small" style="color:var(--warn)">+${d-pl} navyše</div>`:'<div class="small" style="color:var(--ok)">hotovo</div>'):'<span class="muted">–</span>'}</td></tr>`; }).join('')}</table>`
      :'<div class="muted small">Zatiaľ žiadny materiál. Zadajte plán blokov alebo zapíšte prvú nakládku.</div>'}
      ${codes.length?'<button class="btn sm" id="jCopy" style="margin-top:10px">Kopírovať súpis do Excelu</button>':''}</div>
    <div class="card"><h3>Nakládky (${loads.length})</h3>${loads.length?loads.map(l=>loadCard(l,false)).join(''):'<div class="muted small">Zatiaľ žiadne.</div>'}</div>
    ${S.canWrite?'<button class="btn danger block" id="jDel">Zmazať zákazku</button>':''}`;
  const s=openSheet(esc(j.name),body);
  s.querySelectorAll('[data-load]').forEach(e=>e.onclick=()=>loadSheet(S.loads.find(l=>l.id===e.dataset.load)));
  s.querySelectorAll('[data-js]').forEach(e=>e.onclick=async()=>{ if(e.dataset.js!==j.status) await write(()=>db.collection('jobs').doc(id).update({status:e.dataset.js,updatedAt:Date.now()})); });
  const q=sel=>s.querySelector(sel);
  if(q('#jEdit')) q('#jEdit').onclick=()=>jobModal(j);
  if(q('#jLoad')) q('#jLoad').onclick=()=>{ closeSheet(); loadSheet(null,id); };
  if(q('#jPlan')) q('#jPlan').onclick=()=>planSheet(j);
  if(q('#jCopy')) q('#jCopy').onclick=async()=>{ const rows=[['Kód','Rozmer','Hmotnosť kg/ks','Naložené ks','Naložené kg','Plán ks']].concat(codes.map(c=>{ const b=blkByCode(c)||{}; return [c,b.dims||'',b.weight||'',p.done[c]||0,(p.done[c]||0)*(b.weight||0),plan[c]||'']; }));
    try{ await navigator.clipboard.writeText(`Zákazka: ${j.name}\n`+rows.map(r=>r.join('\t')).join('\n')); toast('Skopírované – vložte do Excelu'); }catch(e){ toast('Kopírovanie zlyhalo'); } };
  if(q('#jDel')) q('#jDel').onclick=()=>confirmBox(loads.length?`Zákazka má ${loads.length} nakládok. Zmazať zákazku aj s nakládkami?`:'Naozaj zmazať zákazku?','Zmazať',async()=>{
    for(const l of loads){ if(!await write(()=>db.collection('loads').doc(l.id).delete())) return; }
    if(await write(()=>db.collection('jobs').doc(id).delete())){ closeSheet(); toast('Zákazka zmazaná'); } });
}
function planSheet(j){
  const qty={...(j.plan||{})};
  const s=openSheet('Plán blokov – '+esc(j.name),'<p class="small muted" style="margin-top:0">Koľko kusov ktorého bloku zákazka potrebuje. Podľa toho appka ukáže, koľko ešte zostáva naložiť.</p><div id="pPick"></div>',`<div class="sum" id="pSum"></div><button class="btn pri" id="pSave">Uložiť plán</button>`);
  const upd=()=>{ const items=Object.entries(qty).map(([code,q])=>({code,qty:q})); s.querySelector('#pSum').innerHTML=`<b>${piecesOf(items)} ks</b> · ${tons(weightOf(items))}`; };
  picker(s.querySelector('#pPick'),qty,upd); upd();
  s.querySelector('#pSave').onclick=async()=>{ if(await write(()=>db.collection('jobs').doc(j.id).update({plan:null,updatedAt:Date.now()}).then(()=>db.collection('jobs').doc(j.id).update({plan:qty})))){ toast('Plán uložený'); openJob(j.id); } };
}
function jobModal(j,after){
  if(!S.canWrite) return;
  const isNew=!j; j=j||{status:'planned'};
  const m=openModal(`<h2>${isNew?'Nová zákazka – '+COL[S.co]:'Upraviť zákazku'}</h2>
    <label class="f">Názov zákazky *<input id="zN" value="${esc(j.name||'')}" placeholder="napr. Oporný múr – Novák, Trenčín"></label>
    <label class="f">Zákazník / odberateľ<input id="zC" value="${esc(j.customer||'')}"></label>
    <label class="f">Miesto stavby / dodania<input id="zP" value="${esc(j.place||'')}"></label>
    <label class="f">Kontakt (telefón)<input id="zK" value="${esc(j.contact||'')}" inputmode="tel"></label>
    <label class="f">Stav<select id="zS">${Object.entries(JOB_ST).map(([k,n])=>`<option value="${k}" ${j.status===k?'selected':''}>${n}</option>`).join('')}</select></label>
    <label class="f">Poznámka<textarea id="zO">${esc(j.note||'')}</textarea></label>
    <div class="mfoot"><button class="btn" id="zX">Zrušiť</button><button class="btn pri" id="zOk">Uložiť</button></div>`);
  m.querySelector('#zX').onclick=closeModal;
  m.querySelector('#zOk').onclick=async()=>{
    const name=m.querySelector('#zN').value.trim(); if(!name){ m.querySelector('#zN').focus(); return; }
    const data={name,customer:m.querySelector('#zC').value.trim(),place:m.querySelector('#zP').value.trim(),contact:m.querySelector('#zK').value.trim(),status:m.querySelector('#zS').value,note:m.querySelector('#zO').value.trim(),updatedAt:Date.now()};
    if(isNew){ data.company=S.co; data.createdAt=Date.now(); data.createdBy=S.me||null; data.plan={}; const ref=db.collection('jobs').doc();
      if(await write(()=>ref.set(data))){ closeModal(); toast('Zákazka založená'); if(after) after(ref.id); else openJob(ref.id); } }
    else if(await write(()=>db.collection('jobs').doc(j.id).update(data))){ closeModal(); toast('Uložené'); }
  };
  setTimeout(()=>m.querySelector('#zN').focus(),50);
}
function blockModal(b){
  const isNew=!b; const can=S.canWrite;
  if(isNew&&!can) return;
  b=b||{company:S.co,series:'',active:true,texture:S.co==='redirock'?S.tex:undefined};
  const used=!isNew && S.loads.some(l=>(l.items||[]).some(i=>i.code===b.code));
  const m=openModal(`<h2>${isNew?'Nový blok':esc(b.code)}</h2>${!isNew&&b.img&&IMG[b.img]?`<img class="cat-img" src="${IMG[b.img]}" alt="">`:''}
    ${can?`<label class="f">Kód *<input id="bC" value="${esc(b.code||'')}" ${used?'disabled':''}></label>${used?'<div class="small muted" style="margin:-6px 0 10px">Kód sa nedá zmeniť – blok už je v nakládkach.</div>':''}
    <label class="f">Rada / skupina<input id="bS" value="${esc(b.series||'')}" list="serList"><datalist id="serList">${[...new Set(coBlocks().map(x=>x.series))].map(x=>`<option>${esc(x)}</option>`).join('')}</datalist></label>
    <label class="f">Popis<input id="bD" value="${esc(b.desc||'')}" placeholder="napr. hladká, uhlová, stredový"></label>
    <div class="row"><label class="f" style="flex:2">Rozmer<input id="bR" value="${esc(b.dims||'')}" placeholder="180x60x60 cm"></label><label class="f" style="flex:1">Hmotnosť kg<input id="bW" inputmode="numeric" value="${esc(b.weight??'')}"></label></div>
    ${S.co==='redirock'?`<label class="f">Textúra<select id="bT">${Object.entries(TEX).map(([k,n])=>`<option value="${k}" ${b.texture===k?'selected':''}>${n}</option>`).join('')}</select></label>`:''}
    <label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="bA" style="width:auto;margin:0" ${b.active!==false?'checked':''}> Ponúkať pri zápise nakládky</label>
    <div class="mfoot">${!isNew&&!used?'<button class="btn danger" id="bDel" style="margin-right:auto">Zmazať</button>':''}<button class="btn" id="bX">Zavrieť</button><button class="btn pri" id="bOk">Uložiť</button></div>`
    :`<div class="kv"><div>Rada</div><div>${esc(b.series)}</div><div>Popis</div><div>${esc(b.desc||'—')}</div><div>Rozmer</div><div>${esc(b.dims||'—')}</div><div>Hmotnosť</div><div>${b.weight?b.weight+' kg':'—'}</div></div><div class="mfoot"><button class="btn" id="bX">Zavrieť</button></div>`}`);
  m.querySelector('#bX').onclick=closeModal;
  if(!can) return;
  const del=m.querySelector('#bDel'); if(del) del.onclick=()=>confirmBox(`Zmazať blok ${b.code} z katalógu?`,'Zmazať',async()=>{ await write(()=>db.collection('blocks').doc(b.id).delete()); });
  m.querySelector('#bOk').onclick=async()=>{
    const code=(m.querySelector('#bC').value||'').trim(); if(!code){ m.querySelector('#bC').focus(); return; }
    if(S.blocks.some(x=>x.code===code && x.id!==b.id)){ toast('Kód už existuje'); return; }
    const w=m.querySelector('#bW').value.trim();
    const data={code,series:m.querySelector('#bS').value.trim(),desc:m.querySelector('#bD').value.trim(),dims:m.querySelector('#bR').value.trim(),weight:w===''?null:+w,active:m.querySelector('#bA').checked,updatedAt:Date.now()};
    if(S.co==='redirock') data.texture=m.querySelector('#bT').value;
    if(isNew){ const id=(S.co==='redirock'?'rr_':'zk_')+code.replace(/[^A-Za-z0-9_-]/g,'_');
      data.company=S.co; data.order=Math.max(0,...S.blocks.map(x=>x.order||0))+1; data.img=null;
      if(S.blocks.some(x=>x.id===id)){ toast('Kód už existuje'); return; }
      if(await write(()=>db.collection('blocks').doc(id).set(data))){ closeModal(); toast('Blok pridaný'); } }
    else if(await write(()=>db.collection('blocks').doc(b.id).update(data))){ closeModal(); toast('Uložené'); }
  };
}
async function copyLoads(){
  const rows=[['Dátum','Čas','Zákazka','Zákazník','Kód bloku','Ks','Kg','Nakladal','ŠPZ','Poznámka']];
  coLoads().forEach(l=>{ const j=jobById(l.jobId)||{}; const d=new Date(l.at);
    (l.items||[]).forEach(i=>rows.push([`${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`,`${pad(d.getHours())}:${pad(d.getMinutes())}`,j.name||'',j.customer||'',i.code,i.qty,i.qty*((blkByCode(i.code)||{}).weight||0),(l.loaders||[]).join(', '),l.plate||'',l.note||''])); });
  try{ await navigator.clipboard.writeText(rows.map(r=>r.map(x=>String(x).replace(/[\t\n]/g,' ')).join('\t')).join('\n')); toast('Skopírované – vložte do Excelu'); }catch(e){ toast('Kopírovanie zlyhalo'); }
}

/* ---------- wiring ---------- */
document.querySelectorAll('#coSeg button').forEach(b=>b.onclick=()=>{ S.co=b.dataset.co; S.lq=''; S.cq=''; persist(); render(); });
document.querySelectorAll('#nav [data-v]').forEach(b=>b.onclick=()=>{ S.view=b.dataset.v; S.lq=''; persist(); render(); window.scrollTo(0,0); });
$('#navPlus').onclick=()=>loadSheet();
render();

function sub(col,key,setter){
  const timer=setTimeout(()=>{ if(!S.got[key] && PIN && !$('#modal').classList.contains('on')) banner('Server zatiaľ neodpovedá – skontrolujte pripojenie.'); },10000);
  db.collection(col).onSnapshot(snap=>{
    setter(snap.docs.map(d=>({id:d.id,...d.data()})));
    if(!snap.metadata.fromCache){ S.got[key]=1; clearTimeout(timer); if(S.got.b&&S.got.j&&S.got.l&&S.got.w) banner(''); }
    else if(snap.size) S.got[key]=1;
    render();
    if(S.openJob && $('#sheet').classList.contains('on') && key!=='w'){ const sy=$('.sbody')?$('.sbody').scrollTop:0; openJob(S.openJob); const sb=$('.sbody'); if(sb) sb.scrollTop=sy; }
  },err=>{ clearTimeout(timer); S.got[key]=1; banner(err.code==='revoked'?'Prístup k údajom bol zmenený.':'Údaje sa nepodarilo načítať.'); render(); });
}
/* ---------- server (Cloudflare D1) ---------- */
let PIN=''; try{ PIN=localStorage.getItem('nk-pin')||''; }catch(e){}
const listeners={}; let pollT=null, pollAgain=false;
async function api(method,path,body){
  let r;
  try{ r=await fetch('/api/'+path,{method,headers:{'x-app-pin':PIN,'content-type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'}); }
  catch(e){ throw {code:'unavailable'}; }
  if(r.status===401){ askPin(true); throw {code:'unauth'}; }
  if(!r.ok){ let m=''; try{ m=(await r.json()).error||''; }catch(e){} throw {code:r.status>=500?'server':'bad',message:m}; }
  return r.json();
}
let pollP=null;
async function pollOnce(){
  try{ const d=await api('GET','all'); banner(''); for(const c in listeners) listeners[c].forEach(fn=>fn(d[c]||[])); }
  catch(e){ if(e.code==='server') banner('Chyba servera: '+(e.message||'skúste neskôr')); else if(e.code!=='unauth') banner('Nedá sa spojiť so serverom – skúšam znova…'); }
}
function poll(){
  if(pollP){ pollAgain=true; return pollP; }
  clearTimeout(pollT);
  pollP=(async()=>{ do{ pollAgain=false; await pollOnce(); }while(pollAgain); pollP=null; pollT=setTimeout(poll, document.hidden?60000:15000); })();
  return pollP;
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && PIN) poll(); });
const newId=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/[^a-zA-Z0-9]/g,'').slice(0,20);
const after=p=>p.then(async r=>{ await poll(); return r; });
db={ collection(col){ return {
  doc(id){ id=id||newId(); return { id,
    set:d=>after(api('PUT',col+'/'+encodeURIComponent(id),d)),
    update:d=>after(api('PATCH',col+'/'+encodeURIComponent(id),d)),
    delete:()=>after(api('DELETE',col+'/'+encodeURIComponent(id))) }; },
  onSnapshot(next){ (listeners[col]=listeners[col]||[]).push(rows=>next({docs:rows.map(r=>{ const {id,...x}=r; return {id,data:()=>x}; }),size:rows.length,metadata:{fromCache:false}})); return ()=>{}; }
}; } };
function askPin(wrong){
  const m=openModal(`<img src="/logo.png" alt="Zemkop blok" style="display:block;width:190px;max-width:70%;margin:6px auto 16px"><h2>Prihlásenie</h2><p class="small muted" style="margin-top:0">Zadajte PIN aplikácie. Zapamätá sa v tomto telefóne.</p>
    <label class="f">PIN<input id="pinI" type="password" inputmode="numeric" autocomplete="current-password"></label>${wrong&&PIN?'<div class="small" style="color:var(--bad);margin:-6px 0 10px">Nesprávny PIN.</div>':''}
    <div class="mfoot"><button class="btn pri" id="pinOk">Pokračovať</button></div>`);
  const go=()=>{ const v=m.querySelector('#pinI').value.trim(); if(!v) return; PIN=v; try{ localStorage.setItem('nk-pin',v); }catch(e){} closeModal(); banner(''); poll(); };
  m.querySelector('#pinOk').onclick=go; m.querySelector('#pinI').onkeydown=e=>{ if(e.key==='Enter') go(); };
  setTimeout(()=>m.querySelector('#pinI').focus(),50);
}
sub('blocks','b',r=>S.blocks=r);
sub('jobs','j',r=>S.jobs=r);
sub('loads','l',r=>S.loads=r.sort((a,b)=>b.at-a.at));
sub('workers','w',r=>S.workers=r.sort((a,b)=>(a.name||'').localeCompare(b.name||'','sk')));
if(PIN) poll(); else askPin(false);
})();
</script>
